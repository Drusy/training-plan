app_description: |
  Transform your athletic ambitions into a structured, personalized training plan — powered by AI.

  Whether you're preparing for your first marathon, a triathlon, or a cycling race, TrainingPlanCoach analyzes your profile and goals to generate a complete program that fits your level and schedule.
  <br /><br />
  **YOUR RACE, YOUR PLAN**  
  Add your upcoming competitions, set your target date, and get a training plan built week by week, session by session — automatically.  
  <br />
  **AI THAT WORKS FOR YOU**  
  Choose the engine that fits your needs: on-device algorithm (offline, free), Apple Intelligence (free, powerful, private), or Claude / GPT-4o (cutting-edge cloud AI, ~$0.01/plan).  
  <br />
  **MULTI-SPORT**  
  Running · Cycling · Swimming · Triathlon  
  <br />
  **TRACK YOUR PROGRESS**  
  Check off each session as you complete it. Stay motivated with daily notifications and a home screen widget showing your next workout at a glance.  
  <br />
  **RACE COUNTDOWN**  
  Never lose sight of your goal. A dedicated widget counts down the days to your next competition.  
  <br />
  **CONNECT WITH STRAVA**  
  Sync your activities and let the AI refine your plan based on your real performance data.  
  <br />
  **FOR EVERY LEVEL**  
  Whether you're a beginner training for your first 10K or an experienced triathlete targeting an Ironman, TrainingPlanCoach adapts to your profile.  

